name: Validate Infrastructure

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  LOCATION: ${{ vars.AZURE_LOCATION }}
  ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT }}

jobs:
  validate:

    name: Validate Bicep Templates
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}


      - name: Validate subscription deployment
        run: |
          az deployment sub validate \
            --location $LOCATION \
            --template-file subscription.bicep \
            --parameters @environments/$ENVIRONMENT/subscription.parameters.json


      - name: Validate resource group deployment
        run: |
          az deployment group validate \
            --resource-group rg-stackoverflow2010-$ENVIRONMENT-mexicocentral \
            --template-file main.bicep \
            --parameters @environments/$ENVIRONMENT/main.parameters.json