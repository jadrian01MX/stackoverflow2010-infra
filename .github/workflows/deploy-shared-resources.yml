name: Deploy Shared Seed Storage

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  LOCATION: ${{ vars.AZURE_LOCATION }}

jobs:
  deploy:
    name: Deploy shared seed storage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy shared resources
        run: |
          az deployment sub create \
            --name stackoverflow2010-shared-seed-storage \
            --location "$LOCATION" \
            --template-file shared.bicep \
            --parameters \
              location="$LOCATION" \
              databaseDeploymentPrincipalId="${{ vars.DATABASE_DEPLOYMENT_PRINCIPAL_ID }}"