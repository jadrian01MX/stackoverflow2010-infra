name: Deploy Shared Seed Storage

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  LOCATION: ${{ vars.AZURE_LOCATION }}

jobs:
  deploy:
    name: Deploy shared seed storage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get GitHub Actions service principal object ID
        id: github-actions-sp
        run: |
          PRINCIPAL_ID=$(az ad sp show \
            --id "${{ secrets.AZURE_CLIENT_ID }}" \
            --query id \
            --output tsv)

          test -n "$PRINCIPAL_ID"

          echo "principalId=$PRINCIPAL_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy shared resources
        run: |
          az deployment sub create \
            --name stackoverflow2010-shared-seed-storage \
            --location "$LOCATION" \
            --template-file shared.bicep \
            --parameters \
              location="$LOCATION" \
              githubActionsPrincipalId="${{ steps.github-actions-sp.outputs.principalId }}"