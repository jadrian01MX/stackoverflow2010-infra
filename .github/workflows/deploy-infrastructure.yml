name: Deploy Infrastructure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  LOCATION: ${{ vars.AZURE_LOCATION }}
  ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT }}

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}


      - name: Deploy subscription resources
        run: |
          az deployment sub create \
            --location $LOCATION \
            --template-file subscription.bicep \
            --parameters @environments/$ENVIRONMENT/subscription.parameters.json


      - name: Deploy resource group resources
        run: |
          az deployment group create \
            --resource-group rg-stackoverflow2010-$ENVIRONMENT-mexicocentral \
            --template-file main.bicep \
            --parameters @environments/$ENVIRONMENT/main.parameters.json